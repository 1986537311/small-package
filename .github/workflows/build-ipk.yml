name: Build ImmortalWrt 25.12 x86_64
on:
  workflow_dispatch:
env:
  OPENWRT_BRANCH: openwrt-25.12
  IMMORTALWRT_REPO: immortalwrt/immortalwrt
  TARGET: x86/64
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 安装依赖
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib gettext git libncurses-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget zstd
      - name: 克隆ImmortalWrt源码
        uses: actions/checkout@v4
        with:
          repository: ${{ env.IMMORTALWRT_REPO }}
          branch: ${{ env.OPENWRT_BRANCH }}
          path: immortalwrt
      - name: 导入small-package插件源
        run: |
          cd immortalwrt
          echo "src-git small https://github.com/1986537311/small-package.git" >> feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install nanohatoled
      - name: 生成基础配置
        run: |
          cd immortalwrt
          make ${{ env.TARGET }}.defconfig
          # 如需自定义配置，可以在这里追加scripts/config指令
      - name: 开始编译固件
        run: |
          cd immortalwrt
          make -j$(nproc)
      - name: 上传固件产物
        uses: actions/upload-artifact@v4
        with:
          path: immortalwrt/bin/targets/${{ env.TARGET }}/*.img
